<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepal forest fire detection</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
</head>
<body>
    

    <div id="map-container">

        <div class="map-title">
            <div>
                <strong>Forest Fire Monitoring</strong>
            </div>
        </div>
            <!-- Floating Controls Overlay -->
        <div class="floating-panel">
            <div class="panel-title">Layer Controls</div>

            <div class="control-group">
                <label for="satellite">Detection Layer</label>
                <select id="satellite">
                    <option value="VIIRS_NOAA21_NRT" selected>VIIRS NOAA-21 (375m)</option>
                    <option value="VIIRS_SNPP_NRT">VIIRS S-NPP (375m)</option>
                    <option value="MODIS_NRT">MODIS (1km)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="timeRange">Time Window</label>
                <select id="timeRange">
                    <option value="1">Last 24 Hours</option>
                    <option value="2">Last 48 Hours</option>
                    <option value="5">Last 5 Days</option>
                </select>
            </div>

            <div class="control-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="toggleHeatmap" checked>
                    Enable Heatmap
                </label>
            </div>

            <!-- Geo-Fence Alert Panel with Nearest Authority Trigger -->
            <div id="geoFenceAlert" class="alert-banner">
                ⚠️ <strong>GEO-FENCE WARNING!</strong><br>
                <span id="alertMessage">0 fires inside active zone.</span>
                
                <button id="sendAlertBtn" style="margin-top: 10px; width: 100%; padding: 8px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                    📧 Send Alert to Nearest Authority
                </button>

                <!-- Status container showing single dispatched nearest authority -->
                <div id="dispatchStatus" style="display: none; margin-top: 10px; text-align: left; font-size: 0.85rem; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 4px;"></div>
            </div>

            <!-- Heatmap Density Legend -->
            <div class="legend-section">
                <div class="panel-title">Heatmap Density</div>
                <div class="gradient-bar"></div>
                <div class="legend-labels">
                    <span>Low</span>
                    <span>Moderate</span>
                    <span>High Intensity</span>
                </div>
            </div>

            <!-- Point Confidence Legend -->
            <div class="legend-section">
                <div class="panel-title">Point Confidence</div>
                <ul class="confidence-list">
                    <li class="confidence-item">
                        <span class="color-dot high"></span> High Confidence
                    </li>
                    <li class="confidence-item">
                        <span class="color-dot nominal"></span> Nominal Confidence
                    </li>
                    <li class="confidence-item">
                        <span class="color-dot low"></span> Low Confidence
                    </li>
                </ul>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <!-- External Leaflet & Leaflet.draw Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script>
     const defaultBBox = "{{ bbox }}";
    </script>

    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
    
    
</body>
</html>
